services:
  - type: web
    name: mini-iot-utopia-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        fromDatabase:
          name: mini-iot-utopia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MQTT_URL
        value: mqtt://broker.hivemq.com:1883
      - key: CORS_ALLOWED_ORIGINS
        value: https://mini-iot-utopia.vercel.app,http://localhost:5173

databases:
  - name: mini-iot-utopia-db
    databaseName: mini-iot-utopia
    user: iot-user
